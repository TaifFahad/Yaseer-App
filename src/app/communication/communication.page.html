 <ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>المحادثة</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" dir="rtl">
  <!-- Profile Section -->
  <div *ngIf="parent.parentId" class="profile-section">
    <ion-avatar class="custom-avatar">
      <img [src]="parent.profileImageUrl || 'assets/default-avatar.jpg'" alt="Profile Image">
    </ion-avatar>
    <p class="parent-name">{{ parent.parentName || 'ولي أمر غير معروف' }}</p>
  </div>

  <!-- Messages Section -->
 <!-- Messages Section -->
<div class="messages-section">
  <ion-list>
    <ion-item *ngFor="let message of parent.messages" class="message" [ngClass]="{
      'driver-message': message.senderType === 'driver' || message.senderType === 'system',
      'parent-message': message.senderType === 'parent'
    }">
      <ion-label>
        <h3>
          {{ 
            message.senderType === 'driver' ? 'السائق' : 
            message.senderType === 'system' ? 'النظام' : 
            message.senderType === 'parent' ? 'ولي الامر' : 
            'السائق' 
          }}
        </h3>
        <p>{{ message.text }}</p>
      </ion-label>
      <small class="message-time">{{ message.time }}</small>
    </ion-item>
  </ion-list>
</div>

</ion-content>

<!-- Message Footer -->
<ion-footer class="ion-no-border message-footer">
  <ion-toolbar>
    <div class="message-box">
      <ion-buttons slot="start">
        <ion-button class="inside-icon" (click)="triggerFileInput()">
          <ion-icon name="attach-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-input 
        placeholder="اكتب رسالة" 
        [(ngModel)]="newMessage" 
        class="message-input" 
        (ionInput)="checkInput()">
      </ion-input>
      <ion-buttons slot="end">
        <ion-button 
          class="inside-icon" 
          [disabled]="!canSendMessage" 
          (click)="sendMessage(parent.parentId)">
          <ion-icon name="send-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </div>
  </ion-toolbar>
</ion-footer>

<!-- File Input (Hidden) -->
<input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;">
