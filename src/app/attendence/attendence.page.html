<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-right">جدولة الرحلة</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content dir="rtl">

  <ion-card class="type">
    <ion-card-header class="ion-text-right">
      <ion-card-title class="title-success">نوع الرحلة للغد </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <!-- Form starts here -->
      <form #tripForm="ngForm" (ngSubmit)="onSubmit()">
        <ion-segment [(ngModel)]="subscriptionType" name="subscriptionType" required>
          <ion-segment-button value="both">
            <ion-label>ذهاب و اياب</ion-label>
          </ion-segment-button>
          <ion-segment-button value="morningRide">
            <ion-label>ذهاب فقط</ion-label>
          </ion-segment-button>
          <ion-segment-button value="noonRide">
            <ion-label>اياب فقط</ion-label>
          </ion-segment-button>
        </ion-segment>
        
        <ion-note *ngIf="!subscriptionType" color="danger">
          <small>يجب الاختيار</small>
        </ion-note>
      </form>
    </ion-card-content> 
  </ion-card>
  
  <ion-card class="info">
    <ion-card-header class="ion-text-right">
      <ion-card-title class="title-danger"></ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <div *ngIf="students && students.length > 0">
        <div *ngFor="let student of students" class="student-info-container">
          <ion-thumbnail slot="end" class="round-image">
            <img [src]="student.profileImageUrl || 'assets/default-profile.png'" alt="{{ student.name }}">
          </ion-thumbnail>
  
          <div class="student-details">
            <h2 class="student-name">{{ student.name }}</h2>
            <p class="student-class">الصف: {{ student.studentClass }}</p>
          </div>
        </div>
      </div>
      
      <ion-card class="custom-card">
        <ion-card-content>
          <h2>حضور يوم الغد</h2>
          <div class="date-display ion-text-center" style="font-size: 16px; color: #060606; margin-left: 50%; margin-bottom: 10%;">
            {{ arabicDate }}
          </div>
          <ion-list>
            <!-- Updated to store selected attendance in the form -->
            <div (click)="selectAttendance('attended')" 
                 [ngClass]="{'custom-radio attended-radio': attendanceStatus === 'attended', 'selected': attendanceStatus === 'attended'}">
              <ion-label class="attended-label">حاضر</ion-label>
            </div>
            <div (click)="selectAttendance('absent')" 
                 [ngClass]="{'custom-radio absent-radio': attendanceStatus === 'absent', 'selected': attendanceStatus === 'absent'}">
              <ion-label class="absent-label">غائب</ion-label>
            </div>
          </ion-list>

          <!-- Submit Button inside the form -->
          <ion-button expand="block" (click)="onSubmit()">
            تسجيل
          </ion-button>
        </ion-card-content>
      </ion-card>

    </ion-card-content>
  </ion-card>

</ion-content>
